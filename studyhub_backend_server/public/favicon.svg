<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer White Circle Ring -->
  <circle cx="64" cy="64" r="62" fill="#FFFFFF" />

  <!-- Inner Royal Blue Circle -->
  <circle cx="64" cy="64" r="56" fill="url(#blueGradient)" />

  <!-- Graduation Cap Icon -->
  <g transform="translate(24, 28) scale(1.6)" filter="url(#shadow)">
    <!-- Cap Diamond Base -->
    <polygon points="25,4 47,15 25,26 3,15" fill="#FFFFFF" />
    <polygon points="25,6 44,15 25,24 6,15" fill="#F8FAFC" />
    
    <!-- Cap Underneath Skull Cap -->
    <path d="M12,20 L12,32 C12,38 38,38 38,32 L38,20 C34,24 16,24 12,20 Z" fill="#E2E8F0" />
    
    <!-- Tassel String & Knob -->
    <circle cx="25" cy="15" r="2.5" fill="#F59E0B" />
    <path d="M25,15 Q36,18 39,28" stroke="#F59E0B" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <!-- Tassel Fringe -->
    <polygon points="37,28 41,28 40,36 38,36" fill="#F59E0B" />
  </g>
</svg>